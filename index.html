<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ДСК — простои</title>
<style>
  :root{
    --bg:#f3f4f6; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
    --red:#d42a3a; --red-bg:#fdecee; --green:#15925a; --green-bg:#e7f6ee;
    --amber:#b45309; --accent:#1f2937; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px 110px}
  header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
  header .brand{font-weight:700;font-size:17px;flex:1}
  header .meta{text-align:right;font-size:13px;line-height:1.2;opacity:.9}
  header .meta b{font-size:17px;display:block;font-variant-numeric:tabular-nums}
  #demoBar{background:#d42a3a;color:#fff;font-weight:700;font-size:13px;padding:8px 16px;text-align:center}
  .view{display:none;padding-top:14px}
  .view.active{display:block}
  h2{font-size:20px;margin:6px 2px 12px}
  h3{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;
    box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .ok{background:var(--green-bg);color:var(--green);border-radius:var(--radius);padding:18px;margin-bottom:14px;
    font-weight:700;font-size:20px}
  .ok small{display:block;font-weight:500;font-size:14px;color:#2f6b4f;margin-top:4px}
  .stopcard{background:var(--red-bg);border:2px solid var(--red);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .stopcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .stopcard .reason{font-size:20px;font-weight:800;color:var(--red)}
  .stopcard .timer{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--red);white-space:nowrap}
  .stopcard .info{color:#4b5563;font-size:14px;margin:6px 0 12px}
  .stopcard .late{color:var(--amber);font-weight:700}
  .big{width:100%;border:0;border-radius:var(--radius);padding:20px;font-size:24px;font-weight:800;cursor:pointer;
    display:block;text-align:center;line-height:1.15}
  .big small{display:block;font-size:14px;font-weight:600;opacity:.85;margin-top:4px}
  .big:active{transform:scale(.99)}
  .stop{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(212,42,58,.3);margin-bottom:12px}
  .note{background:#2563eb;color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.25);margin-bottom:16px;padding:16px;font-size:20px}
  .go{background:var(--green);color:#fff;padding:14px;font-size:19px}
  .btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;width:100%}
  .btn.ghost{background:#e5e7eb;color:var(--ink)}
  .btn.wa{background:#1fa855}
  .btn:disabled{opacity:.5}
  .bar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}
  .bar .lbl{flex:0 0 46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .track{flex:1;height:10px;background:#f1f2f4;border-radius:6px;overflow:hidden}
  .bar .fill{height:100%;background:var(--red);border-radius:6px}
  .bar .val{flex:0 0 74px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  .total{font-size:28px;font-weight:800;margin-bottom:4px;font-variant-numeric:tabular-nums}
  .muted{color:var(--muted);font-size:14px}
  /* bottom tabs */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;
    padding-bottom:env(safe-area-inset-bottom);z-index:6}
  nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12px;color:var(--muted);cursor:pointer}
  nav.tabs button span{display:block;font-size:22px;line-height:1.1}
  nav.tabs button.on{color:var(--ink);font-weight:700}
  /* forms */
  label.f{display:block;font-weight:700;margin:16px 0 8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 10px;text-align:left;cursor:pointer;
    font-weight:600;min-height:56px;display:flex;align-items:center;gap:8px;line-height:1.15}
  .opt .e{font-size:22px}
  .opt.on{border-color:var(--red);background:var(--red-bg)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:15px}
  .chip.on{border-color:var(--accent);background:var(--accent);color:#fff}
  input.t,select.t,textarea.t{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;background:#fff;font-size:17px}
  textarea.t{min-height:70px;resize:vertical}
  input.t:focus,select.t:focus,textarea.t:focus{outline:none;border-color:var(--accent)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .photos .ph{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:#ddd}
  .photos img{width:100%;height:100%;object-fit:cover}
  .photos .x{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);
    color:#fff;font-size:14px;cursor:pointer;line-height:24px;padding:0}
  .pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pbtn{display:block;text-align:center;border:2px dashed #cbd0d6;border-radius:12px;padding:14px;font-weight:700;cursor:pointer;background:#fff}
  /* sheet */
  .sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sheet .shead{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 16px;
    border-bottom:1px solid var(--line);z-index:2}
  .sheet .shead b{flex:1;font-size:18px}
  .sheet .close{border:0;background:#e5e7eb;border-radius:999px;width:36px;height:36px;font-size:18px;cursor:pointer}
  .sheet .sbody{max-width:560px;margin:0 auto;padding:0 16px 360px}
  .sheet .sfoot{position:fixed;bottom:0;left:0;right:0;background:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line)}
  .sheet .sfoot .in{max-width:528px;margin:0 auto}
  .done{text-align:center;padding:40px 10px 20px}
  .done .ic{font-size:64px}
  .done h2{margin:10px 0 6px}
  .preview{-webkit-user-select:text;user-select:text;white-space:pre-wrap;text-align:left;background:#fff;border-radius:12px;padding:14px;font-size:15px;margin:16px 0;border:1px solid var(--line)}
  /* log */
  .li{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;border-left:5px solid var(--green)}
  .li.act{border-left-color:var(--red)}
  .li .r1{display:flex;justify-content:space-between;gap:8px;font-weight:700}
  .li .r2{color:var(--muted);font-size:14px;margin-top:2px}
  .li a{color:#2563eb}
  .badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap}
  .badge.r{background:var(--red-bg);color:var(--red)}
  .badge.g{background:var(--green-bg);color:var(--green)}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#e5e7eb;border-radius:14px;padding:4px;margin-top:16px}
  .seg button{border:0;border-radius:11px;padding:12px 6px;font-weight:700;background:transparent;cursor:pointer;font-size:15px}
  .seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .seg button.on[data-mode=stop]{color:var(--red)} .seg button.on[data-mode=fact]{color:#1d4ed8}
  .li.fact{border-left-color:#3b82f6}
  .badge.b{background:#dbeafe;color:#1d4ed8}
  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 16px;
    border-radius:12px;font-size:15px;z-index:20;max-width:90%;display:none}
  #toast.err{background:var(--red)}
  #loading{position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:30;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;font-weight:700}
  .spin{width:42px;height:42px;border:4px solid #d1d5db;border-top-color:var(--accent);border-radius:50%;animation:s 0.8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
</style>
</head>
<body>
<header>
  <div class="brand">⚙️ ДСК · Простои</div>
  <div class="meta"><b id="clock">--:--</b><span id="shiftLabel"></span></div>
</header>
<div id="demoBar" hidden>⚠️ Форма НЕ подключена к таблице — записи не сохраняются. Нужна ссылка API_URL.</div>

<div class="wrap">
  <section id="v-now" class="view active">
    <div id="statusBox"></div>
    <button class="big stop" id="btnStop">⛔ СТОП<small>зафиксировать простой</small></button>
    <button class="big note" id="btnNote">📝 ЗАМЕЧАНИЕ<small>без остановки линии</small></button>
    <div class="card">
      <h3>Простои за текущую смену</h3>
      <div id="shiftSummary"></div>
    </div>
  </section>

  <section id="v-shift" class="view">
    <h2>Отчёт за смену</h2>
    <div class="card">
      <div class="row2">
        <div><label class="f" style="margin-top:0">Дата смены</label><input class="t" type="date" id="sDate"></div>
        <div><label class="f" style="margin-top:0">Смена</label>
          <select class="t" id="sShift"><option>Смена 1 (ночь)</option><option>Смена 2 (день)</option></select></div>
      </div>
      <label class="f">Подано на ДСК по опер. учёту, т</label>
      <input class="t" id="sTons" inputmode="numeric" placeholder="например, 12366">
      <label class="f">План на следующую смену — погрузчики</label>
      <div class="row2"><input class="t" id="sLoaders" inputmode="numeric" value="2" placeholder="кол-во">
        <input class="t" id="sLoaderModel" value="WA600" placeholder="модель"></div>
      <label class="f">Самосвалы</label>
      <div class="row2"><input class="t" id="sTrucks" inputmode="numeric" value="3" placeholder="кол-во">
        <input class="t" id="sTruckCap" inputmode="numeric" value="55" placeholder="тонн"></div>
      <label class="f">Комментарий</label>
      <textarea class="t" id="sComment" placeholder="необязательно"></textarea>
    </div>
    <button class="btn" id="btnShift">Сохранить отчёт</button>
    <div class="card" style="margin-top:14px"><h3>Последние отчёты</h3><div id="shiftList"></div></div>
  </section>

  <section id="v-log" class="view">
    <h2>Журнал простоев</h2>
    <div id="logList"></div>
  </section>
</div>

<nav class="tabs">
  <button data-v="now" class="on"><span>🏭</span>Сейчас</button>
  <button data-v="shift"><span>📋</span>Смена</button>
  <button data-v="log"><span>🗂️</span>Журнал</button>
</nav>

<div class="sheet" id="sheet" hidden></div>
<div id="toast"></div>
<div id="loading"><div class="spin"></div><div id="loadingText">Отправка…</div></div>

<script>
/* ================= Справочники (редактировать здесь) ================= */
const REASONS = [
  {k:'Металлодетектор', e:'⛔'},
  {k:'Негабарит', e:'🪨'},
  {k:'Ремонт / ППР', e:'🔧'},
  {k:'Красный сигнал', e:'🚨'},
  {k:'Заполнение конуса', e:'⚠️'},
  {k:'Обед / пересменка', e:'🍽️'},
  {k:'Переполнение бункера', e:'🔁'},
  {k:'Нехватка подачи руды', e:'🚚'},
  {k:'Отключение питания', e:'⚡'},
  {k:'Прочее', e:'❓'},
];
const EQUIPMENT = ['Вся линия ДСК','Щековая дробилка','Конусная дробилка','Приёмный бункер','Питатель','Конвейер','Грохот'];
const EXPECTED = [{l:'15 мин',v:15},{l:'30 мин',v:30},{l:'1 ч',v:60},{l:'2 ч',v:120},{l:'4 ч',v:240},{l:'Не знаю',v:''}];
// Ссылка-приглашение в WhatsApp-группу (Инфо группы → «Пригласить по ссылке»).
// Если заполнить — кнопка копирует текст и сразу открывает группу. Пусто — откроется выбор чата.
const WA_GROUP_LINK = 'https://chat.whatsapp.com/IUHKJJvf7AL623JbESpSVP';
// Ссылка на развёрнутый скрипт (…/exec). Нужна, только если эта страница размещена отдельно
// (например, на GitHub Pages), чтобы фото уходили в WhatsApp вместе с текстом.
const API_URL = 'https://script.google.com/macros/s/AKfycbzvWoAwDwao8ijxqhLJSLjuaWQ-_3Xev9OoHazt0uptaGbyzJk1_Ge45ijVVmHHWOQ2/exec';
const DAY_START = 8, NIGHT_START = 20;
const MAX_PHOTOS = 4;
const PHOTO_REQUIRED = false;  // true — без фото запись не отправится

/* ================= Связь с сервером / демо ================= */
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isNote = r => r.status === 'Замечание' || r.status === 'Факт';
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
function api(fn, arg){
  if (IS_GAS) return new Promise((res, rej) =>
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](arg));
  if (API_URL) return fetch(API_URL, {method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn, arg})})
    .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error || 'Ошибка сервера'); return j.result; });
  return new Promise((res, rej) => setTimeout(() => { try { res(Demo[fn](arg)); } catch(e){ rej(e); } }, 350));
}

/* ================= Утилиты ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const fmtTime = ms => { const d = new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const fmtDate = ms => { const d = new Date(ms); return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(); };
const isoDate = ms => { const d = new Date(ms); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
function fmtMin(m){ m = Math.max(0, Math.round(m)); const h = Math.floor(m/60); return h ? h+' ч '+pad(m%60)+' мин' : m+' мин'; }
function fmtTimer(ms){ const s = Math.max(0, Math.floor(ms/1000)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h+':'+pad(m) : m) + ':' + pad(x); }
const emojiOf = r => (REASONS.find(x => x.k === r) || {e:'•'}).e;
function shiftOf(d){
  const h = d.getHours(); const noon = x => new Date(x.getFullYear(), x.getMonth(), x.getDate(), 12).getTime();
  if (h >= DAY_START && h < NIGHT_START) return {date: noon(d), name:'Смена 2 (день)'};
  if (h >= NIGHT_START) return {date: noon(new Date(d.getTime()+864e5)), name:'Смена 1 (ночь)'};
  return {date: noon(d), name:'Смена 1 (ночь)'};
}
function getName(){ try { return localStorage.getItem('dsk_name') || ''; } catch(e){ return ''; } }
function setName(n){ try { localStorage.setItem('dsk_name', n); } catch(e){} }
function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', err ? 5000 : 2500); }
function loading(on, text){ $('#loading').style.display = on ? 'flex' : 'none'; if (text) $('#loadingText').textContent = text; }
const errMsg = e => (e && e.message) ? e.message : String(e);
function waLink(text){ return 'https://wa.me/?text=' + encodeURIComponent(text); }

function compress(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Не удалось прочитать фото')); };
    img.src = url;
  });
}

/* ================= Состояние и отрисовка ================= */
let STATE = null, offset = 0;
async function refresh(){
  try { STATE = await api('getState'); offset = STATE.now - Date.now(); render(); }
  catch(e){ toast('Нет связи: ' + errMsg(e), true); }
}
const now = () => Date.now() + offset;

function render(){
  if (!STATE) return;
  const cs = STATE.currentShift;
  $('#shiftLabel').textContent = cs.name;
  // активные простои
  const box = $('#statusBox');
  if (!STATE.active.length){
    const lastDone = STATE.recent.find(r => r.status === 'Запущен' && r.end);
    box.innerHTML = '<div class="ok">✅ ДСК работает<small>' +
      (lastDone ? 'Последний простой: ' + esc(lastDone.reason) + ', запуск в ' + fmtTime(lastDone.end) : 'Простоев нет') + '</small></div>';
  } else {
    box.innerHTML = STATE.active.map(s => {
      const exp = s.expected ? s.start + s.expected*60000 : null;
      return '<div class="stopcard"><div class="top"><div class="reason">' + emojiOf(s.reason) + ' ' + esc(s.reason) + '</div>' +
        '<div style="text-align:right"><div class="muted" style="font-size:12px">стоим</div><div class="timer" data-start="' + s.start + '">' + fmtTimer(now()-s.start) + '</div></div></div>' +
        '<div class="info">' + (s.equipment ? esc(s.equipment) + ' · ' : '') + 'стоп в ' + fmtTime(s.start) + ' · ' + esc(s.by) +
        (exp ? '<br><span data-exp="' + exp + '">Ожидаемый запуск ~' + fmtTime(exp) + '</span>' : '') +
        (s.photosStop && s.photosStop.length ? ' · 📷 ' + s.photosStop.length : '') +
        (s.comment ? '<br>💬 ' + esc(s.comment) : '') + '</div>' +
        '<button class="big go" data-launch="' + esc(s.id) + '">🟢 ЗАПУСК</button></div>';
    }).join('');
    box.querySelectorAll('[data-launch]').forEach(b => b.onclick = () => openLaunch(b.dataset.launch));
  }
  // сводка по смене
  const inShift = STATE.recent.filter(r => r.date && fmtDate(r.date) === fmtDate(cs.date) && r.shift === cs.name);
  const facts = inShift.filter(isNote).length;
  const by = {}; let total = 0;
  inShift.filter(r => !isNote(r)).forEach(r => { const m = r.status === 'Стоит' ? (now()-r.start)/60000 : (r.minutes || 0);
    by[r.reason] = (by[r.reason] || 0) + m; total += m; });
  const items = Object.entries(by).sort((a,b) => b[1]-a[1]); const mx = items.length ? items[0][1] : 1;
  const factLine = facts ? '<div class="muted" style="margin-top:8px">📝 Замечаний: ' + facts + '</div>' : '';
  $('#shiftSummary').innerHTML = (!items.length ? '<div class="muted">Простоев в этой смене нет 👍</div>' :
    '<div class="total">' + fmtMin(total) + '</div><div class="muted" style="margin-bottom:8px">' + (inShift.length - facts) + ' случ. · ' + esc(cs.name) + ', ' + fmtDate(cs.date) + '</div>' +
    items.map(([k,m]) => '<div class="bar"><div class="lbl">' + emojiOf(k) + ' ' + esc(k) + '</div><div class="track"><div class="fill" style="width:' +
      Math.max(4, m/mx*100) + '%"></div></div><div class="val">' + fmtMin(m) + '</div></div>').join('')) + factLine;
  // журнал
  $('#logList').innerHTML = !STATE.recent.length ? '<div class="empty">Записей пока нет</div>' : STATE.recent.map(r => {
    const act = r.status === 'Стоит', fact = isNote(r);
    const ph = [].concat((r.photosStop||[]).map((u,i) => link(u, 'фото ' + (i+1))), (r.photosStart||[]).map((u,i) => link(u, 'фото запуска ' + (i+1))));
    return '<div class="li' + (act ? ' act' : fact ? ' fact' : '') + '"><div class="r1"><span>' + emojiOf(r.reason) + ' ' + esc(r.reason) + '</span>' +

/* ================= Экран «Готово» ================= */
function copyText(text){
  let ok = false;
  try { // синхронный способ — работает внутри Apps Script
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy'); document.body.removeChild(ta);
  } catch(e){}
  try { if (!ok && navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).catch(() => {}); ok = true; } } catch(e){}
  return ok;
}
function dataUrlToFile(dataUrl, name){
  const b64 = dataUrl.split(',')[1]; const bin = atob(b64); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new File([u8], name, {type:'image/jpeg'});
}
function done(title, text, note, photos, waSent){
  photos = photos || [];
  if (waSent) return doneAuto(title, text, photos);
  let files = [];
  try { files = photos.map((p,i) => dataUrlToFile(p, 'dsk-' + Date.now() + '-' + (i+1) + '.jpg')); } catch(e){ files = []; }
  const canShareFiles = files.length && navigator.share && navigator.canShare && (() => { try { return navigator.canShare({files}); } catch(e){ return false; } })();
  if (canShareFiles) return doneShare(title, text, note, photos, files);
  // Основная кнопка — wa.me: WhatsApp открывается уже с вставленным текстом (буфер обмена не нужен),
  // остаётся выбрать группу. Ссылка на группу — запасная: открывает чат, текст берётся из буфера.
  const btn = 'class="btn wa" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px" target="_blank" rel="noopener"';
  const ghost = 'class="btn ghost" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px"';
  const main = '<a ' + btn + ' href="' + waLink(text) + '">📤 Отправить в WhatsApp (текст уже внутри)</a>' +
    '<button ' + ghost + ' id="dCopy">📋 Скопировать текст</button>' +
    (WA_GROUP_LINK ? '<a ' + ghost + ' id="dGroup" target="_blank" rel="noopener" href="' + esc(WA_GROUP_LINK) + '">Открыть группу (вставить вручную)</a>' : '');
  openSheet('', '<div class="done"><div class="ic">✅</div><h2>' + esc(title) + '</h2>' +
    '<div class="muted">Данные в Google Таблице. Отправьте сообщение в группу:</div>' +
    '<div class="preview" id="dText">' + esc(text.replace(/\*/g, '')) + '</div>' + (note ? '<div class="muted">' + esc(note) + '</div>' : '') +
    '<div class="muted">Нажмите зелёную кнопку → выберите группу → «Отправить».</div></div>',
    main + '<button class="btn ghost" id="dOk">Готово</button>');
  $('#dOk').onclick = closeSheet;
  const copyWithFeedback = () => {
    if (copyText(text)) { toast('Текст скопирован ✓'); return; }
    // не дали скопировать — выделяем текст, чтобы скопировать долгим нажатием
    try { const r = document.createRange(); r.selectNodeContents($('#dText')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } catch(e){}
    toast('Зажмите выделенный текст → «Скопировать»', true);
  };
  $('#dCopy').onclick = copyWithFeedback;
  const g = $('#dGroup');
  if (g) g.onclick = () => { copyText(text); };
  if (photos.length) $('#sheet .done').insertAdjacentHTML('beforeend',
    '<div class="muted" style="margin-top:12px">Фото: зажмите → «Скопировать» или «Сохранить», затем вставьте в чат</div>' +
    '<div class="photos" style="justify-content:center">' + photos.map(p => '<div class="ph" style="width:110px;height:110px"><img src="' + p + '"></div>').join('') + '</div>');
}

// Отправка фото + текста через системное меню «Поделиться» (WhatsApp → группа → Отправить)
function doneShare(title, text, note, photos, files){
  openSheet('', '<div class="done"><div class="ic">✅</div><h2>' + esc(title) + '</h2>' +
    '<div class="muted">Данные в Google Таблице. Отправьте в группу вместе с фото:</div>' +
    '<div class="preview">' + esc(text.replace(/\*/g, '')) + '</div>' +
    '<div class="photos" style="justify-content:center">' + photos.map(p => '<div class="ph" style="width:96px;height:96px"><img src="' + p + '"></div>').join('') + '</div>' +
    '<div class="muted" style="margin-top:12px">Нажмите кнопку → WhatsApp → выберите группу → Отправить. ' +
      'Если подпись не встала под фото — нажмите на поле «Добавить подпись» → «Вставить» (текст уже скопирован).</div>' + (note ? '<div class="muted">' + esc(note) + '</div>' : '') + '</div>',
    '<button class="btn wa" style="margin-bottom:8px" id="dShare">📤 Отправить фото и текст</button>' +
    (WA_GROUP_LINK ? '<a class="btn ghost" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px" target="_blank" rel="noopener" href="' + esc(WA_GROUP_LINK) + '">Открыть группу</a>' : '') +
    '<button class="btn ghost" id="dOk">Готово</button>');
  $('#dOk').onclick = closeSheet;
  $('#dShare').onclick = () => {
    copyText(text); // запасной вариант: если подпись не встала — вставить из буфера
    navigator.share({files, text}).catch(err => {
      if (err && err.name === 'AbortError') return;
      // браузер не дал поделиться файлами — показываем обычный вариант
      toast('Меню «Поделиться» недоступно, текст скопирован', true);
      setTimeout(() => done(title, text, note, []), 50);
      setTimeout(() => $('#sheet .done').insertAdjacentHTML('beforeend',
        '<div class="muted" style="margin-top:12px">Фото: зажмите → «Скопировать» или «Сохранить», затем вставьте в чат</div>' +
        '<div class="photos" style="justify-content:center">' + photos.map(p => '<div class="ph" style="width:110px;height:110px"><img src="' + p + '"></div>').join('') + '</div>'), 80);
    });
  };
}

/* ================= ДЕМО (работает, когда страница открыта не из Apps Script) ================= */
const DKEY = 'dsk_demo_v2';
const Demo = {
  _db(){ let d = null; try { d = JSON.parse(localStorage.getItem(DKEY)); } catch(e){}
    if (!d) { d = this._seed(); this._save(d); } return d; },
  _save(d){ try { localStorage.setItem(DKEY, JSON.stringify(d)); } catch(e){ Demo._mem = d; } },
  _seed(){
    const t = Date.now(), M = 60000;
    const mk = (reason, eq, startAgo, mins, by, lb, comment, ph) => { const st = t - startAgo*M; const sh = shiftOf(new Date(st));
      return {id:'D'+st, date:sh.date, shift:sh.name, reason, equipment:eq, start:st, end: mins==null ? null : st+mins*M,
        minutes:mins, expected:null, by, launchedBy:lb, comment, photosStop:ph, photosStart:[], status: mins==null ? 'Стоит' : 'Запущен'}; };
    return { stops: [], shifts: [] };
  },
  getState(){ const d = this._db(); const sh = shiftOf(new Date());
    return { now: Date.now(), active: d.stops.filter(s => s.status === 'Стоит'), recent: d.stops.slice(-60).reverse(),
      shifts: d.shifts.slice(-10).reverse(), currentShift: sh }; },
  startStop(p){ const d = this._db(), t = Date.now(), sh = shiftOf(new Date(t));
    d.stops.push({id:'D'+t, date:sh.date, shift:sh.name, reason:p.reason, equipment:p.equipment, start:t, end: p.noStop ? t : null, minutes: p.noStop ? 0 : null,
      expected: p.expected ? Number(p.expected) : null, by:p.author, launchedBy:'', comment:p.comment,
      photosStop:(p.photos||[]).map(() => 'demo'), photosStart:[], status: p.noStop ? 'Замечание' : 'Стоит'});
    this._save(d); return {ok:true, id:'D'+t, start:t, photoCount:(p.photos||[]).length}; },
  endStop(p){ const d = this._db(), s = d.stops.find(x => x.id === p.id);
    if (!s || s.status !== 'Стоит') return {ok:false, error:'Этот простой уже закрыт'};
    const t = Date.now(); s.end = t; s.minutes = Math.round((t - s.start)/60000); s.launchedBy = p.author; s.status = 'Запущен';
    if (p.comment) s.comment = (s.comment ? s.comment + ' | ' : '') + 'Запуск: ' + p.comment;
    s.photosStart = (p.photos||[]).map(() => 'demo'); this._save(d); return {ok:true, minutes:s.minutes, end:t}; },
  saveShift(p){ const d = this._db(); const [y,m,dd] = p.date.split('-').map(Number); const date = new Date(y, m-1, dd, 12).getTime();
    const downtime = d.stops.filter(s => fmtDate(s.date) === fmtDate(date) && s.shift === p.shift && s.minutes).reduce((a,s) => a + s.minutes, 0);
    d.shifts = d.shifts.filter(s => !(fmtDate(s.date) === fmtDate(date) && s.shift === p.shift));
    d.shifts.push({date, shift:p.shift, tons:Number(p.tons), loaders:p.loaders, trucks:p.trucks, comment:p.comment, author:p.author, downtime});
    this._save(d); return {ok:true, downtime}; },
};

(function nameFromLink(){
  const apply = n => { if (n) setName(String(n).slice(0, 60)); };
  try { apply(new URLSearchParams(location.search).get('name')); } catch(e){}
  try { if (IS_GAS && google.script.url) google.script.url.getLocation(l => { apply(l.parameter && l.parameter.name); }); } catch(e){}
})();
refresh(); tick();
setInterval(tick, 1000);
setInterval(refresh, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
